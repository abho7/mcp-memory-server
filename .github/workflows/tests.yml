name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # The HNSW engine is a read-only dependency, cloned rather than vendored,
      # so CI always runs against its current main. If an upstream change breaks
      # this server, that should surface here rather than at someone's install.
      - name: Clone hnsw-engine (read-only dependency)
        run: git clone --depth 1 https://github.com/abho7/vectordb-hnsw.git ./hnsw-engine

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Embedding tests need the ONNX MiniLM weights and skip cleanly without
      # them, so a green run here does not by itself prove the embedder works.
      # -rs prints which tests skipped, making that visible in the log instead
      # of hiding behind a passing checkmark.
      - name: Run tests
        run: pytest -v -rs
